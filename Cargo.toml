[package]
name = "askable"
version = "0.6.0"
edition = "2024"
description = "A regression judge for ranked search: replay a frozen corpus, compare case by case, return a verdict"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
ureq = { version = "3.4", features = ["json"] }
